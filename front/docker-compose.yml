# frontend는 완전히 독립된 컨테이너/compose 파일이야. db/backend(back 쪽 compose,
# 아마 docker/docker-compose.yml)와 합칠 필요도, 같은 도커 네트워크에 있을 필요도 없어.
#
# 이유: 프론트 컨테이너(nginx)는 정적 파일만 서빙하고, 백엔드 API를 실제로 호출하는
# 건 컨테이너가 아니라 "브라우저"야(사용자 컴퓨터에서 직접 호출). 그래서 컨테이너끼리
# 서버 대 서버로 서로를 찾아갈 일이 없어. 브라우저가 접속 가능한 백엔드 주소만 빌드
# 시점에 VITE_API_BASE_URL로 박아넣으면 돼.
#
# (참고: db ↔ backend는 서로 컨테이너 이름으로 통신해야 해서 같은 네트워크가 필요하지만,
# 그건 back 쪽 compose 파일 안에서 db+backend가 같이 정의되면 자동으로 해결돼.)
#
# 띄울 때는 그냥 이 폴더에서 따로:
#   docker compose up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 배포용 실제 백엔드 주소로 .env(또는 셸 환경변수)에서 넘겨줘야 함.
        # 예: 홈서버 IP/도메인 기준 http://<homeserver 주소>:8080 같은 값.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
