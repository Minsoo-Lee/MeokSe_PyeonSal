server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router(BrowserRouter)는 /menu/5 같은 경로를 클라이언트 쪽에서 처리한다.
    # 그래서 새로고침하거나 그 주소로 직접 들어와도 서버는 항상 index.html을 내려주고,
    # 라우팅은 브라우저에서 다시 처리하게 해야 한다. 이게 없으면 목록 화면이 아닌
    # 다른 화면에서 새로고침할 때 nginx가 404를 내버린다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite build 결과물(assets/)은 파일명에 해시가 붙어서 나오니 오래 캐싱해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
