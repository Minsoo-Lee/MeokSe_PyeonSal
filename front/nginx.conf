server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router(BrowserRouter)는 /menu/5 같은 경로를 클라이언트 쪽에서 처리한다.
    # 그래서 새로고침하거나 그 주소로 직접 들어와도 서버는 항상 index.html을 내려주고,
    # 라우팅은 브라우저에서 다시 처리하게 해야 한다. 이게 없으면 목록 화면이 아닌
    # 다른 화면에서 새로고침할 때 nginx가 404를 내버린다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 배포할 때마다 내용(참조하는 assets/ 파일명)이 바뀌는데, 캐시 헤더를 따로
    # 안 정해주면 브라우저가 자체 판단(heuristic caching)으로 캐싱해버린다. 그러면 새로
    # 배포해도 강력 새로고침 전까진 예전 화면이 그대로 보이는 문제가 생기므로, index.html만
    # 명시적으로 캐시하지 않게 한다.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # vite build 결과물(assets/)은 파일명에 해시가 붙어서 나오니 오래 캐싱해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 메뉴 썸네일. docker-compose.yml에서 호스트의 docker/thumbnails/를 이 경로에
    # bind mount 해뒀다. 파일명(video_id.jpg)이 안 바뀌는 게 기본이라 assets/만큼 길게는
    # 아니어도 꽤 오래 캐싱해도 안전하다.
    location /thumbnails/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
