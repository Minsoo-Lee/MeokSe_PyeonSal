spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

  application:
    name: back

  # 로컬에서 그냥 실행했을 때의 기본값. 배포/실행 시 SPRING_PROFILES_ACTIVE=prod 로 반드시 덮어쓸 것.
  profiles:
    active: prod

  jpa:
    open-in-view: false
    # data.sql이 Hibernate의 ddl-auto 스키마 생성보다 먼저 실행되는 걸 방지 (dev에서 필요)
    defer-datasource-initialization: true

server:
  port: 8082
  forward-headers-strategy: framework

app:
  # 홈 화면 상단 업데이트 배너에 쓰는 값. 릴리즈할 때마다 CHANGELOG.md 버전과 같이 올릴 것.
  version: "0.5.0"
  update-note: "1. 메뉴마다 코멘트를 달아 이 메뉴가 나한테 어땠는지 생각을 정리할 수 있어요.\n즐겨찾기 뱃지 아래 코멘트 뱃지를 이용해보세요!"

  auth:
    allowed-emails: ${ALLOWED_EMAILS}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 2592000000  # 30일

  frontend-origin: ${FRONTEND_BASE_URL:http://localhost:3000}