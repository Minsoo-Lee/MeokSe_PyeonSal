spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

  application:
    name: back

  # 로컬에서 그냥 실행했을 때의 기본값. 배포/실행 시 SPRING_PROFILES_ACTIVE=prod 로 반드시 덮어쓸 것.
  profiles:
    active: dev

  jpa:
    open-in-view: false
    # data.sql이 Hibernate의 ddl-auto 스키마 생성보다 먼저 실행되는 걸 방지 (dev에서 필요)
    defer-datasource-initialization: true

server:
  port: 8082

app:
  auth:
    allowed-emails: ${ALLOWED_EMAILS}